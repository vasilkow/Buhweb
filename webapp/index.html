<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Казна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error {
            background: #ff3b30;
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #999999);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-primary {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .modal-btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Казна</h1>

        <div id="loading" class="loading">Загрузка...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="card">
                <div class="card-title">Общий баланс</div>
                <div class="card-value" id="totalBalance">0 ₽</div>
            </div>

            <div class="card">
                <div class="card-title">Твоя доля</div>
                <div class="card-value" id="myShare">0 ₽</div>
                <div class="card-subtitle" id="myPercent">0%</div>
            </div>

            <div class="card">
                <div class="card-title">5% с бизнесов</div>
                <div class="card-value" id="businessIncome">0 ₽</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Пополнил</div>
                    <div class="stat-value" id="totalDeposits">0 ₽</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Снял</div>
                    <div class="stat-value" id="totalWithdraws">0 ₽</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn" onclick="openModal('deposit')">➕ Пополнить</button>
                <button class="btn" onclick="openModal('withdraw')">➖ Снять</button>
                <button class="btn btn-secondary" onclick="openModal('business')">🏢 С бизнеса</button>
                <button class="btn btn-secondary" onclick="sendCommand('debts')">💳 Долги</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для операций -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Операция</div>
            <div class="input-group">
                <div class="input-label">Сумма (₽)</div>
                <input type="number" id="amountInput" class="input" placeholder="0">
            </div>
            <div class="input-group">
                <div class="input-label">Комментарий</div>
                <input type="text" id="commentInput" class="input" placeholder="Необязательно">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="modal-btn modal-btn-primary" onclick="submitTransaction()">Подтвердить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userId = tg.initDataUnsafe.user?.id;
        const initData = tg.initData;
        let currentOperation = null;

        // API URL (заменить на свой после деплоя)
        const API_URL = buhweb-production.up.railway.app;

        async function loadData() {
            if (!userId) {
                showError('Не удалось получить данные пользователя');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/user/${userId}`, {
                    headers: {
                        'X-Telegram-Init-Data': initData
                    }
                });

                if (!response.ok) {
                    throw new Error('Ошибка загрузки данных');
                }

                const data = await response.json();

                document.getElementById('totalBalance').textContent = formatMoney(data.totalBalance);
                document.getElementById('myShare').textContent = formatMoney(data.myShare);
                document.getElementById('myPercent').textContent = data.myPercent + '%';
                document.getElementById('businessIncome').textContent = formatMoney(data.businessIncome);
                document.getElementById('totalDeposits').textContent = formatMoney(data.totalDeposits);
                document.getElementById('totalWithdraws').textContent = formatMoney(data.totalWithdraws);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                showError('Ошибка загрузки данных: ' + err.message);
            }
        }

        function formatMoney(amount) {
            return amount.toLocaleString('ru-RU') + ' ₽';
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        function openModal(operation) {
            currentOperation = operation;
            const titles = {
                'deposit': '➕ Пополнение казны',
                'withdraw': '➖ Снятие из казны',
                'business': '🏢 Снятие с бизнеса (5%)'
            };
            document.getElementById('modalTitle').textContent = titles[operation];
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('amountInput').value = '';
            document.getElementById('commentInput').value = '';
            currentOperation = null;
        }

        async function submitTransaction() {
            const amount = parseInt(document.getElementById('amountInput').value);
            const comment = document.getElementById('commentInput').value;

            if (!amount || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            try {
                let type = currentOperation;

                if (currentOperation === 'business') {
                    // Для бизнеса отправляем отдельный запрос
                    const response = await fetch(`${API_URL}/api/transaction`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Telegram-Init-Data': initData
                        },
                        body: JSON.stringify({
                            user_id: userId,
                            type: 'deposit',
                            amount: Math.floor(amount * 0.05), // 5% от суммы
                            comment: `5% с бизнеса (${amount} ₽)`
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Ошибка создания транзакции');
                    }

                    alert(`✅ В категорию 5% с бизнесов поступило ${Math.floor(amount * 0.05).toLocaleString('ru-RU')} ₽`);
                } else {
                    const response = await fetch(`${API_URL}/api/transaction`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Telegram-Init-Data': initData
                        },
                        body: JSON.stringify({
                            user_id: userId,
                            type: type,
                            amount: amount,
                            comment: comment
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.detail || 'Ошибка создания транзакции');
                    }

                    const action = type === 'deposit' ? 'пополнено' : 'снято';
                    alert(`✅ Казна ${action} на ${amount.toLocaleString('ru-RU')} ₽`);
                }

                closeModal();
                loadData(); // Обновляем данные
            } catch (err) {
                alert('Ошибка: ' + err.message);
            }
        }

        function sendCommand(command) {
            tg.sendData(JSON.stringify({ command: command }));
        }

        loadData();
    </script>
</body>
</html>
